[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-gateway"
version = "0.1.0"
description = "Micro-batching LLM serving gateway with token streaming and token-budget admission control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "transformers>=4.56",
    "safetensors",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.7"]
dev = ["pytest>=8", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["gateway*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
